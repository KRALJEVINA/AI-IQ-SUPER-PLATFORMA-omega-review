# Synchronization proposals only; merging requires human review and required CI.
name: 🔀 Omega Mega Merge

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize both proposal workflows to avoid duplicate PR creation.
concurrency:
  group: omega-sync-proposals
  cancel-in-progress: false

jobs:
  propose-sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Test sync safety
        run: node --test scripts/tests/omega-sync.test.cjs
      - name: Propose into-main
        uses: actions/github-script@v7
        with:
          script: |
            const { proposeSync } = require('./scripts/omega-sync.cjs');
            await proposeSync({ github, context, core, direction: 'into-main' });
