# Legacy automatic merging is retired: labels and bot identity are not approvals.
name: 🔄 Omega Auto Merge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-required:
    runs-on: ubuntu-latest
    steps:
      - name: Human review required
        run: echo 'Automatic merging is disabled. Review the PR and require successful CI before manual merge.' >> "$GITHUB_STEP_SUMMARY"
