# ═══════════════════════════════════════════════════════════
# 🏗️ OMEGA Auto Build — CI Pipeline
# ═══════════════════════════════════════════════════════════
#
# Automatski CI quality gate na svaki push/PR.
# Source of truth za deploy/build je Vercel; ovaj workflow radi
# quality validaciju (type-check, lint, unit test, smoke, predeploy), bez deploy koraka.
#

name: 🏗️ Omega Build

on:
  push:
    branches: ['main', 'copilot/**']
  pull_request:
    branches: ['main']

concurrency:
  group: omega-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: 🏗️ Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🧭 Detekcija izmenjenih putanja
        if: github.event_name == 'pull_request'
        id: changed_paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            full_gate:
              - '.github/workflows/**'
              - '.agent-config.json'
              - 'package.json'
              - 'package-lock.json'
              - 'vercel.json'
              - 'src/lib/auth/**'
              - 'src/lib/billing/**'
              - 'src/lib/stripe/**'
              - 'src/lib/security/**'
              - 'docs/MULTI-REPO-LINKS.md'
            lib_api:
              - 'src/lib/**'
              - 'src/app/api/**'
            tests_autofinish:
              - 'src/tests/autofinish/**'
            tests_billing:
              - 'src/tests/billing/**'
            tests_brouvzer:
              - 'src/tests/brouvzer/**'
            tests_call_centar:
              - 'src/tests/call-centar/**'
            tests_depon:
              - 'src/tests/depon/**'
            tests_unit:
              - 'src/tests/unit/**'
            tests_api:
              - 'src/tests/api/**'
            tests_lib:
              - 'src/tests/lib/**'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: OMEGA evidence regression checks
        id: safety
        run: node --test scripts/tests/omega-sync.test.cjs scripts/tests/omega-build.test.cjs

      - name: 📥 Instalacija zavisnosti
        id: install
        run: npm ci

      - name: 🔍 TypeScript provera
        id: types
        run: npx tsc --noEmit

      - name: 🔍 ESLint provera
        id: lint
        run: npm run lint

      - name: 🧪 Unit testovi
        id: unit
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            npm run test:ci
            exit 0
          fi

          if [ "${{ steps.changed_paths.outputs.full_gate }}" = "true" ]; then
            echo "Critical surfaces changed → running full CI test chain"
            npm run test:ci
            exit 0
          fi

          npm run test:core

          if [ "${{ steps.changed_paths.outputs.lib_api }}" = "true" ]; then
            npm run test:lib
            npm run test:api
          fi

          if [ "${{ steps.changed_paths.outputs.tests_lib }}" = "true" ]; then
            npm run test:lib
          fi

          if [ "${{ steps.changed_paths.outputs.tests_api }}" = "true" ]; then
            npm run test:api
          fi

          if [ "${{ steps.changed_paths.outputs.tests_autofinish }}" = "true" ]; then
            npm run test:autofinish:critical
          fi

          if [ "${{ steps.changed_paths.outputs.tests_billing }}" = "true" ]; then
            npm run test:billing
          fi

          if [ "${{ steps.changed_paths.outputs.tests_brouvzer }}" = "true" ]; then
            npm run test:brouvzer
          fi

          if [ "${{ steps.changed_paths.outputs.tests_call_centar }}" = "true" ]; then
            npm run test:call-centar
          fi

          if [ "${{ steps.changed_paths.outputs.tests_depon }}" = "true" ]; then
            npm run test:depon
          fi

          if [ "${{ steps.changed_paths.outputs.tests_unit }}" = "true" ]; then
            npm run test:unit
          fi

      - name: 🧪 Smoke testovi (go-live gate)
        id: smoke
        run: npm run test:smoke

      - name: 🚦 Predeploy operativna provera
        id: predeploy
        run: npm run predeploy:check

      - name: 🏗️ Build provera (release gate)
        id: build
        run: npm run build

      - name: Record CI evidence (never deployment confirmation)
        id: evidence
        if: always()
        env:
          OMEGA_STEPS_JSON: ${{ toJSON(steps) }}
          OMEGA_JOB_STATUS: ${{ job.status }}
          OMEGA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/omega-ci-result.cjs

      - name: Upload CI evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omega-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/omega-ci-result/ci-result.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
